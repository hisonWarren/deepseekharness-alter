<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>代理设置</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --card: #fff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: #d2d2d7;
      --accent: #0071e3;
      --danger: #c62828;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    main {
      padding: 18px 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
    }
    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.18);
    }
    .hints {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .hints button {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      padding: 3px 9px;
      font: inherit;
      color: var(--muted);
      cursor: pointer;
    }
    .hints button:hover { color: var(--text); border-color: #aeaeb2; }
    .err {
      min-height: 16px;
      color: var(--danger);
      font-size: 12px;
    }
    .actions {
      margin-top: auto;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .actions button {
      min-width: 76px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card);
      font: inherit;
      cursor: pointer;
    }
    .actions button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>设置代理地址</h1>
      <p>仅「强制代理」模式使用。可填完整 URL，或只填端口（默认本机 HTTP）。</p>
    </div>
    <div>
      <label for="url">代理 URL</label>
      <input id="url" type="text" spellcheck="false" placeholder="http://127.0.0.1:7897" />
      <div class="hints" style="margin-top:8px">
        <button type="button" data-fill="http://127.0.0.1:7897">Clash 7897</button>
        <button type="button" data-fill="http://127.0.0.1:7890">Clash 7890</button>
        <button type="button" data-fill="http://127.0.0.1:10809">10809</button>
        <button type="button" data-fill="socks5://127.0.0.1:1080">SOCKS5 1080</button>
      </div>
      <div id="err" class="err"></div>
    </div>
    <div class="actions">
      <button type="button" id="cancel">取消</button>
      <button type="button" id="save" class="primary">保存</button>
    </div>
  </main>
  <script>
    const input = document.getElementById('url');
    const err = document.getElementById('err');
    const saveBtn = document.getElementById('save');
    const cancelBtn = document.getElementById('cancel');

    document.querySelectorAll('[data-fill]').forEach((btn) => {
      btn.addEventListener('click', () => {
        input.value = btn.getAttribute('data-fill');
        err.textContent = '';
        input.focus();
      });
    });

    cancelBtn.addEventListener('click', () => window.dshProxyPrefs.cancel());
    saveBtn.addEventListener('click', async () => {
      err.textContent = '';
      saveBtn.disabled = true;
      try {
        const result = await window.dshProxyPrefs.save(input.value);
        if (!result || !result.ok) {
          err.textContent = (result && result.error) || '保存失败';
          saveBtn.disabled = false;
        }
      } catch (e) {
        err.textContent = e.message || '保存失败';
        saveBtn.disabled = false;
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') saveBtn.click();
      if (e.key === 'Escape') cancelBtn.click();
    });

    window.dshProxyPrefs.load().then((prefs) => {
      input.value = (prefs && prefs.proxyUrl) || 'http://127.0.0.1:7897';
      input.focus();
      input.select();
    });
  </script>
</body>
</html>
